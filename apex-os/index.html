<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <!-- viewport-fit=cover lets the app paint under notches; safe-area insets handle the rest -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050608" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Apex OS" />
    <meta name="description" content="Apex OS — one calm command centre for your schedule, money, fitness, CFA prep and tasks." />
    <title>Apex OS</title>
    <!-- Fonts are self-hosted (see globals.css); preload the two used above the fold -->
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plexmono-600-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Paint the app colour before JS/CSS load so there is no white flash */
      html, body { background: #050608; }
    </style>
  </head>
  <body class="bg-void text-fg antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
